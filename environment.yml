# After creating the env, install these WITHOUT deps, in this order (they pin
# protobuf<=3.20.1, which clashes with tensorflow 2.20; yolov5 must go last so its
# yolov5/utils/general.py, which has scale_boxes, overwrites the ultralytics-yolov5 copy):
#   pip install --no-deps -e D:\CNN_Animal_ID\Pytorch-Wildlife
#   pip install --no-deps ultralytics-yolov5==0.1.1
#   pip install --no-deps yolov5==7.0.11
# Finally, make sc_utils importable (same as the original env):
#   echo D:\CNN_Animal_ID\SIN-classifier> "%CONDA_PREFIX%\Lib\site-packages\sin_classifier.pth"
