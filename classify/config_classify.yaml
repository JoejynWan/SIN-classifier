## Arguments for video_to_crops.py
SOURCE_DIR: 'C:\TempDataForSpeed\SINClassifierV2_20250604\raw_videos'
TARGET_DIR: 'C:\TempDataForSpeed\SINClassifierV2_20250604\cropped_resized'
DET_WEIGHTS_PATH: NULL
DET_VERSION: 'MDV6-yolov9-c' #MDV6-yolov9-c, MDV6-yolov9-e, MDV6-yolov10-c, MDV6-yolov10-e, or MDV6-rtdetr-c

## Arguments for train_model.py
# training
conf_id: SINClassifierV2_20250604
algorithm: RSG # options are: Plain or RSG
num_epochs: 200
log_interval: 100
parallel: 0
# data loading
dataset_root: 'C://TempDataForSpeed//SINClassifierV2_20250604'
dataset_name: Custom_Crop
batch_size: 64
num_workers: 12
# model
resume_from_ckpt: NULL
model_name: RSGResNet # options are: PlainResNetClassifier or RSGResNet
num_layers: 50
num_classes: 36
# RSG
head_lists: [1,2,3,4,7,8,14,15,16,17,19,21,22,23,24,25,30,32,34]
epoch_thresh: 100
n_center: 15
transfer_strength: 1.0
loss_type: LDAM # options are: CE, LDAM, or Focal. Automatically CE for plain algo. 

## Optimisation
# feature
train_rule: DRW # options are: None, Reweight, or DRW. Automatically None for plain algo. 
lr_feature: 0.1
momentum_feature: 0.9
weight_decay_feature: 0.0005
# classifier
lr_classifier: 0.1
momentum_classifier: 0.9
weight_decay_classifier: 0.0005
# lr_scheduler
step_size: 30 # for StepLR scheduler in plain algo
milestones: [60, 100, 130, 180] # for MultiStepLR scheduler in rsg algo
gamma: 0.1
